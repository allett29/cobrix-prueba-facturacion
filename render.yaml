# Blueprint Render — panel + API simulada en un solo servicio (Node 24).
# Conectar repo en https://dashboard.render.com → New → Blueprint
services:
  - type: web
    name: cobrix-prueba-facturacion
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '24.11.0'
      - key: HOST
        value: 0.0.0.0
      - key: BILLING_API_HOST
        value: 127.0.0.1
      - key: BILLING_API_PORT
        value: '4310'
      - key: SIMULATOR_URL
        value: http://127.0.0.1:4310
      - key: SANDBOX_TODAY
        value: '2026-10-13'
      - key: COBRIX_SCHEDULER_INTERVAL_MS
        value: '30000'
      - key: COBRIX_MASTER_KEY
        generateValue: true
    # Plan Free: sin disco persistente; data/ del repo + cobrix.sqlite generada al arrancar.
    # Plan de pago: añade disk en /var/data y COBRIX_DB / BILLING_API_DB (ver docs/DEPLOY-RENDER.md).
